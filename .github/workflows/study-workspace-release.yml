name: Desk Drawer Study Windows release

on:
  push:
    tags:
      - "study-v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Desk Drawer Study executable and installer
    runs-on: windows-latest
    env:
      DOWNLOADS_TOKEN: ${{ secrets.DESK_DRAWER_DOWNLOADS_TOKEN }}
    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Verify release version
        id: release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^study-v', ''
          $package = Get-Content 'study-workspace/package.json' -Raw | ConvertFrom-Json
          $tauri = Get-Content 'study-workspace/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ($version -ne $package.version -or $version -ne $tauri.version) {
            throw "Tag version $version must match package and Tauri versions ($($package.version), $($tauri.version))."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-workspace/package-lock.json

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: study-workspace/src-tauri -> study-workspace/src-tauri/target

      - name: Install JavaScript dependencies
        working-directory: study-workspace
        run: npm ci

      - name: Test frontend
        working-directory: study-workspace
        run: npm test

      - name: Check Rust formatting
        working-directory: study-workspace/src-tauri
        run: cargo fmt -- --check

      - name: Test native code
        working-directory: study-workspace/src-tauri
        run: cargo test --lib -j 1

      - name: Build Windows installer
        working-directory: study-workspace
        run: npm run tauri -- build --bundles nsis

      - name: Verify Windows executable and installer
        shell: pwsh
        run: |
          $app = Get-Item 'study-workspace/src-tauri/target/release/desk-drawer-study.exe' -ErrorAction Stop
          if ($app.Length -le 0) {
            throw "Standalone application executable is empty: $($app.FullName)"
          }
          Write-Host "$($app.FullName) ($($app.Length) bytes)"

          $installers = @(Get-ChildItem 'study-workspace/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop)
          if ($installers.Count -eq 0) {
            throw "Expected a Windows NSIS .exe installer."
          }
          $installers | ForEach-Object {
            if ($_.Length -le 0) { throw "Installer is empty: $($_.FullName)" }
            if ($_.Length -lt 100MB) {
              throw "Expected the offline WebView2 Runtime in the installer, but it is unexpectedly small: $($_.FullName)"
            }
            Write-Host "$($_.FullName) ($($_.Length) bytes)"
          }

      - name: Keep Windows app and installer as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desk-Drawer-Study-${{ steps.release.outputs.version }}-Windows-x64
          path: |
            study-workspace/src-tauri/target/release/desk-drawer-study.exe
            study-workspace/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows app and installer to public Downloads release
        if: env.DOWNLOADS_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: hollo-hub/Desk_drawer-downloads
          token: ${{ secrets.DESK_DRAWER_DOWNLOADS_TOKEN }}
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: main
          name: Desk Drawer Study ${{ steps.release.outputs.version }}
          body: |
            Desk Drawer Study ${{ steps.release.outputs.version }} for Windows x64.

            **Recommended:** download `Desk Drawer Study_*_x64-setup.exe`. This NSIS installer includes the WebView2 Runtime and can install it without an internet connection when it is missing.

            The standalone `desk-drawer-study.exe` is also available, but requires the WebView2 Runtime to already be installed.

            **Windows security:** this build is unsigned. Windows SmartScreen may show a warning. A trusted code-signing certificate is required to reduce or avoid that warning.

            Highlights: centered accessible dialogs; higher-contrast themed controls; buddy sprite packs; and a responsive, fixed-height Desk.

            Source code: https://github.com/hollo-hub/Desk_drawer/tree/study-v3-release
          files: |
            study-workspace/src-tauri/target/release/desk-drawer-study.exe
            study-workspace/src-tauri/target/release/bundle/nsis/*-setup.exe
          make_latest: true
