name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Test native code
        working-directory: src-tauri
        run: cargo test --lib -j 1

      - name: Build Windows app and installers
        run: npm run tauri build

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction Stop)
          $msi = @(Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction Stop)
          if ($nsis.Count -eq 0 -or $msi.Count -eq 0) {
            throw "Expected at least one NSIS EXE and one MSI installer."
          }
          @($nsis) + @($msi) | ForEach-Object {
            if ($_.Length -le 0) {
              throw "Installer artifact is empty: $($_.FullName)"
            }
            Write-Host "$($_.FullName) ($($_.Length) bytes)"
          }

      - name: Upload installers to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
